<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SportStore — Inventario Deportivo</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <!-- Estilos propios -->
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="sport-header">
  <div class="container d-flex align-items-center justify-content-between py-3">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-trophy-fill fs-1 text-accent"></i>
      <div>
        <h1 class="mb-0 display-font">SportStore</h1>
        <small class="text-muted-light">Gestión de Inventario Deportivo</small>
      </div>
    </div>
    <!-- Contadores -->
    <div class="d-flex gap-3">
      <div class="stat-pill"><span id="cntTotal">0</span> <small>artículos</small></div>
      <div class="stat-pill accent"><span id="cntValor">$0</span> <small>stock total</small></div>
    </div>
  </div>
</header>

<main class="container py-5">
  <div class="row g-5">

    <!-- ── Columna FORMULARIO ── -->
    <div class="col-lg-5">
      <div class="card sport-card shadow-lg">
        <div class="card-header sport-card-header">
          <i class="bi bi-plus-circle-fill me-2 text-accent"></i>
          <strong>Agregar Artículo</strong>
        </div>
        <div class="card-body p-4">
          <form id="formDeporte" novalidate>

            <!-- 1. Nombre del producto -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-tag me-1"></i>Nombre del Producto
              </label>
              <input type="text" name="nombre" id="nombre"
                     class="form-control fc" placeholder="Pelota de fútbol" required/>
              <div class="invalid-msg" id="err_nombre"></div>
            </div>

            <!-- 2. Deporte / categoría -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-lightning-charge me-1"></i>Deporte / Categoría
              </label>
              <select name="deporte" id="deporte" class="form-select fc" required>
                <option value="">Seleccionar…</option>
                <option>Fútbol</option>
                <option>Basketball</option>
                <option>Tenis</option>
                <option>Natación</option>
                <option>Running</option>
                <option>Ciclismo</option>
                <option>Padel</option>
                <option>Volleyball</option>
              </select>
              <div class="invalid-msg" id="err_deporte"></div>
            </div>

            <!-- 3. Marca -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-award me-1"></i>Marca
              </label>
              <input type="text" name="marca" id="marca"
                     class="form-control fc" placeholder="Nike, Adidas, Topper…" required/>
              <div class="invalid-msg" id="err_marca"></div>
            </div>

            <!-- 4. Precio unitario -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-currency-dollar me-1"></i>Precio Unitario ($)
              </label>
              <input type="number" name="precio" id="precio"
                     class="form-control fc" placeholder="2500" min="0" step="0.01" required/>
              <div class="invalid-msg" id="err_precio"></div>
            </div>

            <!-- 5. Stock -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-boxes me-1"></i>Stock (unidades)
              </label>
              <input type="number" name="stock" id="stock"
                     class="form-control fc" placeholder="10" min="0" required/>
              <div class="invalid-msg" id="err_stock"></div>
            </div>

            <!-- 6. Talla / Talle -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-rulers me-1"></i>Talle / Talla
              </label>
              <select name="talle" id="talle" class="form-select fc">
                <option value="Único">Único</option>
                <option>XS</option><option>S</option><option>M</option>
                <option>L</option><option>XL</option><option>XXL</option>
              </select>
            </div>

            <!-- 7. Color -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-palette me-1"></i>Color principal
              </label>
              <input type="text" name="color" id="color"
                     class="form-control fc" placeholder="Rojo, Azul…"/>
            </div>

            <!-- 8. Condición -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-star me-1"></i>Condición
              </label>
              <div class="d-flex gap-3">
                <div class="form-check">
                  <input class="form-check-input" type="radio"
                         name="condicion" id="cond_nuevo" value="Nuevo" checked/>
                  <label class="form-check-label" for="cond_nuevo">Nuevo</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio"
                         name="condicion" id="cond_usado" value="Usado"/>
                  <label class="form-check-label" for="cond_usado">Usado</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio"
                         name="condicion" id="cond_reacon" value="Reacondicionado"/>
                  <label class="form-check-label" for="cond_reacon">Reacondicionado</label>
                </div>
              </div>
            </div>

            <!-- 9. Descripción / notas -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-chat-text me-1"></i>Notas (opcional)
              </label>
              <textarea name="notas" id="notas" class="form-control fc"
                        rows="2" placeholder="Información adicional…"></textarea>
            </div>

            <!-- Botones -->
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-accent" onclick="agregarArticulo()">
                <i class="bi bi-plus-lg me-2"></i>Agregar al Inventario
              </button>
              <button type="button" class="btn btn-outline-secondary btn-sm" onclick="limpiarFormulario()">
                <i class="bi bi-eraser me-1"></i>Limpiar
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Selector de método de array -->
      <div class="card sport-card shadow mt-4">
        <div class="card-header sport-card-header">
          <i class="bi bi-code-square me-2 text-accent"></i>
          <strong>Método de Almacenaje en Uso</strong>
        </div>
        <div class="card-body p-3">
          <div class="d-grid gap-2">
            <button class="btn btn-method active" id="btnPush" onclick="setMetodo('push')">
              <code>push()</code> — Agrega al final
            </button>
            <button class="btn btn-method" id="btnUnshift" onclick="setMetodo('unshift')">
              <code>unshift()</code> — Agrega al inicio
            </button>
            <button class="btn btn-method" id="btnSplice" onclick="setMetodo('splice')">
              <code>splice()</code> — Inserta en posición
            </button>
          </div>
          <div class="method-info mt-3 p-2" id="methodInfo">
            <code>array.push(item)</code> — Añade el elemento al final del array.
          </div>
        </div>
      </div>
    </div>

    <!-- ── Columna INVENTARIO ── -->
    <div class="col-lg-7">
      <!-- Barra de herramientas -->
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h5 class="mb-0 text-accent-light fw-bold">
          <i class="bi bi-grid-3x3-gap me-2"></i>Inventario
        </h5>
        <div class="d-flex gap-2 flex-wrap">
          <input type="text" id="filtro" class="form-control fc fc-sm"
                 placeholder="🔍 Buscar…" oninput="filtrar()"/>
          <select class="form-select fc fc-sm" id="filtroDeporte" onchange="filtrar()">
            <option value="">Todos los deportes</option>
            <option>Fútbol</option><option>Basketball</option>
            <option>Tenis</option><option>Natación</option>
            <option>Running</option><option>Ciclismo</option>
            <option>Padel</option><option>Volleyball</option>
          </select>
          <button class="btn btn-sm btn-outline-danger" onclick="vaciarInventario()">
            <i class="bi bi-trash3"></i>
          </button>
        </div>
      </div>

      <!-- Grid de tarjetas producto -->
      <div id="inventarioGrid" class="row g-3">
        <div class="col-12 text-center py-5" id="emptyMsg">
          <i class="bi bi-inbox display-4 text-muted d-block mb-3"></i>
          <p class="text-muted">El inventario está vacío. Agregá tu primer artículo.</p>
        </div>
      </div>

      <!-- Consola de arrays -->
      <div class="card sport-card shadow mt-4">
        <div class="card-header sport-card-header d-flex justify-content-between">
          <span><i class="bi bi-terminal me-2 text-accent"></i><strong>Estado del Array</strong></span>
          <span class="badge bg-secondary" id="arrayLen">0 elementos</span>
        </div>
        <div class="card-body p-0">
          <pre id="arrayConsole" class="console-pre mb-0">// El array está vacío</pre>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Lógica JS -->
<script src="app.js"></script>
</body>
</html>
