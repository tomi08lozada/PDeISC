<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Números</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
  <!-- Estilos propios -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       NAVBAR
  ═══════════════════════════════════════════ -->
  <nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
      <!-- Logo / Título de la app -->
      <span class="navbar-brand app-brand">
        <i class="bi bi-hash me-2"></i>NumReg
      </span>

      <!-- Botón día / noche (derecha del navbar) -->
      <button
        id="themeToggle"
        class="btn btn-theme-toggle ms-auto"
        aria-label="Cambiar tema"
        title="Alternar modo claro / oscuro"
      >
        <!-- El ícono cambia según el tema activo -->
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════
       CONTENIDO PRINCIPAL
  ═══════════════════════════════════════════ -->
  <main class="container-fluid app-main py-4">

    <!-- Tarjeta principal de ingreso -->
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="app-card p-4 p-md-5 mb-4">
          <h1 class="app-title mb-1">Ingreso de Números</h1>
          <p class="app-subtitle mb-4">
            Ingresá entre <strong>10</strong> y <strong>20</strong> números.
          </p>

          <!-- ── Formulario de ingreso ── -->
          <div class="input-group mb-3">
            <input
              type="text"
              id="numberInput"
              class="form-control app-input"
              placeholder="Escribí un número…"
              inputmode="numeric"
              autocomplete="off"
              maxlength="20"
              aria-label="Número a ingresar"
            />
            <button
              id="addBtn"
              class="btn btn-add"
              type="button"
              aria-label="Agregar número"
            >
              <i class="bi bi-plus-lg me-1"></i>Agregar
            </button>
          </div>

          <!-- Mensaje de error de validación -->
          <div id="errorMsg" class="app-error mb-3" aria-live="polite"></div>

          <!-- Contador de números ingresados -->
          <div class="d-flex align-items-center justify-content-between mb-4">
            <span class="counter-label">Números ingresados:</span>
            <span id="counter" class="counter-badge">0 / 20</span>
          </div>

          <!-- Barra de progreso visual -->
          <div class="progress app-progress mb-4" role="progressbar" aria-valuemin="0" aria-valuemax="20">
            <div id="progressBar" class="progress-bar" style="width: 0%"></div>
          </div>

          <!-- Botón guardar / descargar (oculto hasta tener ≥10 números) -->
          <button
            id="saveBtn"
            class="btn btn-save w-100 d-none"
            type="button"
          >
            <i class="bi bi-download me-2"></i>Guardar y Descargar .txt
          </button>

          <!-- Botón limpiar (oculto hasta tener al menos 1 número) -->
          <button
            id="clearBtn"
            class="btn btn-clear w-100 mt-2 d-none"
            type="button"
          >
            <i class="bi bi-trash3 me-2"></i>Limpiar todo
          </button>
        </div>

      </div>
    </div>

    <!-- ── Lista de números cargados ── -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <!-- Panel de números (oculto si no hay ninguno) -->
        <div id="numbersPanel" class="app-card p-4 d-none">
          <h2 class="section-title mb-3">
            <i class="bi bi-list-ol me-2"></i>Números cargados
          </h2>
          <!-- Lista de chips / badges con los números -->
          <div id="numbersList" class="numbers-grid"></div>
        </div>

      </div>
    </div>

    <!-- ── Historial de archivos generados ── -->
    <div class="row justify-content-center mt-4">
      <div class="col-12 col-md-8 col-lg-6">
        <div id="historyPanel" class="app-card p-4 d-none">
          <h2 class="section-title mb-3">
            <i class="bi bi-clock-history me-2"></i>Archivos generados
          </h2>
          <ul id="historyList" class="history-list list-unstyled mb-0"></ul>
        </div>
      </div>
    </div>

  </main>

  <!-- ═══════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════ -->
  <footer class="app-footer text-center py-3">
    <small>NumReg &copy; 2026 — Proyecto de registro de números</small>
  </footer>

  <!-- Bootstrap JS Bundle (incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica de la aplicación -->
  <script src="app.js"></script>
</body>
</html>
