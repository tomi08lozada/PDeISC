<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto 3 — Buscador de Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
    <nav class="navbar navbar-dark px-3 px-md-4">
      <span class="navbar-brand">🔍 Proyecto 3</span>
      <button id="btnToggleTheme" type="button">🌙 Modo Noche</button>
    </nav>

    <div class="container">
      <!-- ── Hero ─────────────────────────────────────────────────────────── -->
      <section class="hero">
        <h1>Buscador de Usuarios</h1>
        <p>
          Cargá todos los usuarios y filtrá por nombre en tiempo real.<br />
          La búsqueda resalta las coincidencias mientras escribís.
        </p>

        <!-- Botón para iniciar la carga -->
        <div class="mb-4">
          <button id="btnCargar" type="button">
            📥 Cargar Usuarios
          </button>
        </div>

        <!-- Campo de búsqueda (deshabilitado hasta que se carguen los datos) -->
        <div class="search-wrapper">
          <span class="search-icon">🔎</span>
          <input
            type="text"
            id="campoBusqueda"
            placeholder="Escribí un nombre para buscar..."
            disabled
            autocomplete="off"
          />
        </div>

        <!-- Contador dinámico de resultados -->
        <p id="contadorResultados"></p>
      </section>

      <!-- Estado inicial / cargando -->
      <div id="estadoInicial" class="text-center" style="color: var(--text-secondary); padding: 1rem;">
        Hacé clic en "Cargar Usuarios" para comenzar.
      </div>

      <!-- Mensaje sin resultados -->
      <div id="mensajeVacio">
        😕 No se encontraron usuarios con ese nombre.
      </div>

      <!-- Grid de tarjetas -->
      <div id="contenedorUsuarios" class="row g-3 pb-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
