<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto 1 — Obtener Usuarios</title>

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
    <nav class="navbar navbar-dark px-3 px-md-4">
      <span class="navbar-brand">📡 Proyecto 1</span>
      <!-- Botón día/noche: requerido obligatorio -->
      <button id="btnToggleTheme" type="button">🌙 Modo Noche</button>
    </nav>

    <!-- ── Hero ───────────────────────────────────────────────────────────── -->
    <div class="container">
      <section class="hero">
        <h1>Obtener datos de una API pública</h1>
        <p>
          Se usa <strong>fetch</strong> y <strong>axios</strong> para obtener
          usuarios de JSONPlaceholder.<br />
          Ambos métodos usan <code>POST</code>.
        </p>

        <!-- Botones para elegir método -->
        <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
          <button id="btnFetch" class="btn btn-primary btn-lg px-4">
            🔍 Cargar con fetch
          </button>
          <button id="btnAxios" class="btn btn-warning btn-lg px-4 text-dark">
            ⚡ Cargar con axios
          </button>
        </div>

        <!-- Badge que indica con qué método se cargaron los datos -->
        <div class="mt-3">
          <span id="metodoBadge" style="display: none"></span>
        </div>

        <!-- Mensaje de estado: cargando / error / éxito -->
        <p id="estadoMensaje" class="mt-2" style="display: none"></p>
      </section>

      <!-- ── Grid de usuarios ─────────────────────────────────────────────── -->
      <div id="contenedorUsuarios" class="row g-3 pb-5"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Axios CDN (librería HTTP) -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Lógica del proyecto -->
    <script src="main.js"></script>
  </body>
</html>
