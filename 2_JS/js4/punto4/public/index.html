<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto 4 - API de Alumnos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark px-3 px-md-4">
      <span class="navbar-brand">Proyecto 4 - API Alumnos</span>
      <button id="btnToggleTheme" type="button">Modo noche</button>
    </nav>

    <main class="container-fluid app-shell">
      <section class="hero">
        <div>
          <span class="eyebrow">API propia en Node.js</span>
          <h1>Gestion de alumnos</h1>
        </div>
        <p>Listado, estadisticas y alta con validacion de nombre, apodo y email unicos.</p>
      </section>

      <section class="row g-3 mb-3">
        <div class="col-6 col-lg-3">
          <div class="stat-chip"><strong id="statTotal">-</strong><span>Total</span></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-chip"><strong id="statPromedio">-</strong><span>Promedio</span></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-chip"><strong id="statAprobados">-</strong><span>Aprobados</span></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-chip"><strong id="statReprobados">-</strong><span>Reprobados</span></div>
        </div>
      </section>

      <section class="row g-3 align-items-stretch">
        <div class="col-12 col-xl-8">
          <div class="panel h-100">
            <h2 class="section-title">Lista de alumnos</h2>
            <div class="tabla-wrapper">
              <table class="tabla-alumnos">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apodo</th>
                    <th>Email</th>
                    <th>Materia</th>
                    <th>Nota</th>
                  </tr>
                </thead>
                <tbody id="tablaAlumnosBody">
                  <tr>
                    <td colspan="6" class="text-center py-4">
                      <span class="spinner-border spinner-border-sm me-2"></span>
                      Cargando alumnos...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-4">
          <div class="panel h-100">
            <h2 class="section-title">Agregar alumno</h2>
            <form id="formularioAlumno" novalidate>
              <div class="row g-3">
                <div class="col-12">
                  <label for="inputNombre" class="form-label">Nombre</label>
                  <input type="text" id="inputNombre" class="form-control" placeholder="Nombre completo" />
                </div>
                <div class="col-12 col-md-6 col-xl-12">
                  <label for="inputApodo" class="form-label">Apodo</label>
                  <input type="text" id="inputApodo" class="form-control" placeholder="Apodo unico" />
                </div>
                <div class="col-12 col-md-6 col-xl-12">
                  <label for="inputEmail" class="form-label">Email</label>
                  <input type="email" id="inputEmail" class="form-control" placeholder="alumno@ejemplo.com" />
                </div>
                <div class="col-12 col-md-6 col-xl-12">
                  <label for="selectMateria" class="form-label">Materia</label>
                  <select id="selectMateria" class="form-select">
                    <option value="">Elegir materia</option>
                    <option value="Programacion Web">Programacion Web</option>
                    <option value="Base de Datos">Base de Datos</option>
                    <option value="Redes">Redes</option>
                    <option value="Sistemas Operativos">Sistemas Operativos</option>
                    <option value="Algoritmos">Algoritmos</option>
                  </select>
                </div>
                <div class="col-12 col-md-6 col-xl-12">
                  <label for="inputNota" class="form-label">Nota</label>
                  <input type="number" id="inputNota" class="form-control" placeholder="0 a 10" min="0" max="10" step="1" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-4">Agregar alumno</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
